<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FlowCare</title>
<style>
:root{--bl:#FCE4EC;--lp:#FFF1F5;--p:#E85D8E;--d:#C83E70;--bg:#fff;--card:#fff;--t:#333038;--m:#77717A;--ln:#f3d3de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bl:#4a2a38;--lp:#2b2229;--bg:#1d191f;--card:#262128;--t:#f3eef5;--m:#b9b1bc;--ln:#4a3440;--p:#f07aa3}}
*{box-sizing:border-box}html,body{height:auto;margin:0}body{background:var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:18px 16px 96px}h1{font:600 26px/1.25 Georgia,serif;margin:6px 0 14px}h2{font:600 20px Georgia,serif;margin:18px 0 8px}h3{margin:0 0 6px;font-size:17px}p{margin:6px 0}small,.m{color:var(--m)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:12px 0}.pink{background:var(--lp)}
button{font:inherit;cursor:pointer}.b,.g{border-radius:999px;padding:11px 18px;border:2px solid var(--d);margin:4px 4px 4px 0;min-height:44px}.b{background:var(--d);color:#fff}.g{background:transparent;color:var(--d)}
.ch{border:1.5px solid var(--ln);background:var(--card);color:var(--t);border-radius:999px;padding:8px 14px;margin:3px 3px 3px 0;min-height:40px}.ch.on{background:var(--bl);border-color:var(--d);font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:12px;background:var(--card);color:var(--t);margin:4px 0 10px}input[type=checkbox]{width:auto}label{font-weight:600;display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;max-width:100px;background:none;border:0;padding:10px 2px;color:var(--m);font-size:12px;min-height:56px}nav button.on{color:var(--d);font-weight:700}nav span{display:block;font-size:20px}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.gr i{font-style:normal;font-size:12px;color:var(--m)}.c{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--card);color:var(--t);font-size:14px;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.rec{background:var(--d);color:#fff}.pred{border:2px dashed var(--p);background:var(--lp)}.fert{background:var(--bl)}.tod{outline:2px solid var(--t);outline-offset:1px;font-weight:700}.ov::before{content:"◆";position:absolute;top:0;right:3px;font-size:8px;color:var(--d)}.sym::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:9px;background:var(--p)}.rec.sym::after{background:#fff}.sel{box-shadow:0 0 0 3px var(--p)}
.lg span{display:inline-block;margin:2px 10px 2px 0;font-size:13px;color:var(--m)}.bar{height:10px;background:var(--bl);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--p)}
.ph{display:flex;border-radius:12px;overflow:hidden;font-size:11px;text-align:center;color:#fff}.ph div{padding:10px 2px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--t);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}ul{padding-left:20px;margin:6px 0}a{color:var(--d)}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const D=864e5,$=q=>document.querySelector(q),pd=s=>{const a=s.split('-');return Date.UTC(+a[0],a[1]-1,+a[2])/D},fd=n=>new Date(n*D).toISOString().slice(0,10),
nice=(n,y)=>new Date(n*D).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:y?'numeric':undefined,timeZone:'UTC'}),TD=()=>pd(new Date().toLocaleDateString('en-CA')),
esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---- cycle calculations (pure, testable) ---- */
const C={diff:(a,b)=>pd(b)-pd(a),add:(s,n)=>fd(pd(s)+n),
 lens:ps=>{const s=ps.map(p=>p.start).sort();return s.slice(1).map((x,i)=>pd(x)-pd(s[i]))},
 durs:ps=>ps.filter(p=>p.end).map(p=>pd(p.end)-pd(p.start)+1),
 avg:a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null,
 next:(s,len)=>C.add(s,len),ovul:n=>n-14};
const DEF={setup:0,intro:0,name:'',cl:null,pl:null,reg:'',tips:1,periods:[],logs:{},done:{},rem:{period:1,log:0,tips:1,time:'20:00'}};
let S,V='home',P={};try{S=JSON.parse(localStorage.getItem('fc')||'null')}catch(e){}S=Object.assign({},DEF,S||{});
const save=()=>{try{localStorage.setItem('fc',JSON.stringify(S))}catch(e){}};
function toast(m){const t=$('#toast');t.innerHTML=`<div class=toast role=status>${m}</div>`;setTimeout(()=>t.innerHTML='',3200)}
function info(){const s=S.periods.map(p=>p.start).sort();if(!s.length)return null;const L=C.lens(S.periods).slice(-6),len=C.avg(L)||S.cl,dur=C.avg(C.durs(S.periods).slice(-6))||S.pl||5,last=pd(s[s.length-1]);return{last,len,dur,L,next:len?last+len:null}}
/* ---- content ---- */
const TIPS=['Cycle Day 1 is the first day of bleeding — not the day it ends.','Cycle length is counted from the first day of one period to the first day of the next.','Cycles can vary a little from month to month. That’s common.','Tracking a few cycles shows your own pattern better than any average.','Predictions are estimates. They can’t confirm ovulation or prevent pregnancy.'];
const MSG=['You’re learning your body, one day at a time.','Questions about your body are always welcome here.','Be gentle with yourself today.','Rest is allowed.','You don’t need to understand everything at once.'];
const strip=(a,b,l)=>`<div class="card pink"><div class=row><b>${a}</b><b>${b}</b></div><div class=bar style="margin:8px 0"><div style="width:100%"></div></div><p class=m style="text-align:center">${l}</p></div>`;
const mini=(y,mo,rs,ps)=>grid(y,mo,d=>rs.includes(d)?'rec':ps.includes(d)?'pred':'');
const Q=(a,o,i,w)=>({q:a,o,a:i,w});
const L=[
{t:'What is a menstrual cycle?',b:()=>'<p>A cycle starts on the <b>first day of one period</b> and ends the day before your next period begins. The first day of bleeding is <b>Cycle Day 1</b>.</p>',s:'Day 1 = first day of bleeding. The cycle runs until the day before the next period.',q:Q('Your bleeding starts on Monday. What is Monday?',['Cycle Day 1','Cycle Day 0','The last day of your cycle'],0,'The first day of bleeding is always Cycle Day 1.')},
{t:'How do I calculate my cycle length?',b:()=>'<p>Count from the <b>first day of one period to the first day of the next</b> — not to the day bleeding ends.</p><p>Example: Period A starts 1 March, Period B starts 29 March → <b>28 days</b>.</p>'+mini(2026,2,[1,29],[]),s:'Start date to next start date. Nothing else.',q:Q('If your period started on 3 June and your next period started on 1 July, how long was your cycle?',['27 days','28 days','30 days'],1,'3 June to 30 June is 27 days, and one more day reaches 1 July: 28 days.')},
{t:'When might my next period start?',b:()=>'<p>Add your usual cycle length to the first day of your most recent period.</p><p>Example: starts 1 March + 28 days = <b>29 March</b>.</p>'+mini(2026,2,[1,2,3,4,5],[29])+'<p class=m>This is an estimate. Cycles can arrive earlier or later.</p>',s:'Last start date + usual cycle length = estimated next start.',q:Q('Last period started 10 May. Usual cycle: 30 days. When might the next one start?',['8 June','9 June','10 June'],1,'10 May + 30 days = 9 June. Treat it as a guess, not a promise.')},
{t:'How do I calculate period duration?',b:()=>'<p>Count the days you bleed, with the <b>first day as Day 1</b>.</p><p>Example: bleeding from 3 March to 7 March = 3,4,5,6,7 → <b>5 days</b>.</p>',s:'Count every bleeding day, including the first.',q:Q('You bled from 12 to 16 July. How many days is that?',['4 days','5 days','6 days'],1,'12, 13, 14, 15, 16 = 5 days. The first day counts.')},
{t:'What if my period is irregular?',b:()=>'<p>Cycles can vary, and it can take several recorded cycles to see your own pattern. There is no need to force your cycle into 28 days — that is just an average.</p>',s:'Keep tracking. Your pattern matters more than the average.',q:Q('Your cycles were 26, 33 and 29 days. What is a helpful takeaway?',['Something is definitely wrong','Cycles vary; keep tracking to see your pattern','You must fix it to 28 days'],1,'Some variation is common. If changes worry you, a clinician can help you look closer.')},
{t:'What is ovulation?',b:()=>'<p>Ovulation is when an ovary releases an egg. Its timing varies from person to person and cycle to cycle. It is often estimated as about 14 days before the next expected period, but a calendar <b>cannot reliably confirm it</b>.</p><p><b>A predicted fertile window is not reliable contraception.</b></p>',s:'It’s an estimate, and it moves. Don’t rely on it to prevent pregnancy.',q:Q('Can calendar predictions reliably prevent pregnancy?',['Yes','No — they are estimates and not reliable contraception'],1,'Ovulation timing varies, so calendar estimates aren’t dependable contraception.')},
{t:'What are the phases of my cycle?',b:()=>'<p>Four phases (a typical 28-day example — yours may differ):</p><div class=ph><div style="flex:5;background:#C83E70">Period<br>1–5</div><div style="flex:8;background:#E85D8E">Follicular<br>to ~13</div><div style="flex:1;background:#7a5cc8">O</div><div style="flex:14;background:#a85a7a">Luteal 15–28</div></div><p><b>Menstruation</b>: bleeding. <b>Follicular</b>: body prepares an egg. <b>Ovulation</b>: egg released. <b>Luteal</b>: after ovulation, until the next period.</p>',s:'Bleed → prepare → release → wait for the next period.',q:Q('Which phase comes right after ovulation?',['Follicular','Luteal','Menstruation'],1,'The luteal phase follows ovulation and lasts until your next period starts.')},
{t:'When should I be concerned?',b:()=>'<p>Some variation is common. Talk to a doctor or nurse if you notice:</p><ul><li>Very heavy bleeding (soaking a pad or tampon every hour for several hours)</li><li>Severe pain that stops you doing daily things</li><li>Fainting or feeling very dizzy</li><li>Periods lasting longer than 7 days</li><li>Cycles regularly shorter than 21 or longer than 35 days</li><li>Missing periods for 3 months or more</li></ul><p>If pregnancy is possible, take a pregnancy test. Seek urgent care for sudden severe pain. FlowCare can’t diagnose anything.</p>',s:'Heavy, severe, fainting or lasting changes → ask a professional.',q:Q('Which is worth speaking to a clinician about?',['Soaking through protection every hour for several hours','A cycle 2 days shorter than last month','Feeling a bit tired before your period'],0,'Very heavy bleeding like this should be checked. A 2-day change is usually normal variation.')}];
const CM=[
{t:'My period is late',a:'A period arriving later than expected does not automatically mean something is wrong. Cycle timing can change for several reasons.',i:'Stress, illness, travel, sleep changes and normal variation can all shift timing. If you’ve had sex, pregnancy is also possible.',s:['Check the first day of your last period and your usual range','Take a pregnancy test if pregnancy is possible','Keep logging how you feel'],m:'See a clinician if you’ve missed 3 or more periods, have severe pain, or late periods keep happening.',late:1},
{t:'My cramps are really painful',a:'I’m sorry you’re dealing with discomfort today. Period pain can make even ordinary activities feel difficult.',i:'Cramps are common, but pain that is severe, sudden or unusual deserves attention.',s:['Rest if you can','Try a warm compress or warm bath','Gentle movement or stretching may help','Pain relief can help if it’s safe for you — follow the label and ask a pharmacist if unsure'],m:'Get medical advice for severe pain that medicine doesn’t ease, pain that is getting worse over cycles, fainting, fever or very heavy bleeding.'},
{t:'My cycle has changed',a:'It’s understandable to worry when something feels different. You’re right to notice it.',i:'Cycles can shift with stress, illness, sleep, weight changes, some medicines and life stages.',s:['Log your next few periods','Note what else changed recently','Compare dates in Insights'],m:'If changes last more than a few cycles or come with pain or heavy bleeding, speak to a clinician.'},
{t:'I feel emotional today',a:'Feeling emotional is real and valid. Many people notice mood changes around their period.',i:'Hormones shift across the cycle and can affect how you feel. That doesn’t make your feelings less real.',s:['Be gentle with your schedule','Talk to someone you trust','Log your mood to spot patterns'],m:'If low mood feels overwhelming or you have thoughts of harming yourself, please contact a doctor or local emergency or crisis service.'},
{t:'I don’t understand what my body is doing',a:'Periods can be confusing, especially when your body doesn’t follow the dates you expected. You’re not wrong for having questions.',i:'Most people were never taught how cycles are counted. It’s learnable.',s:['Try “Understand Your Cycle”','Log your period start dates','Use “Explain this simply” on any lesson'],m:'If something feels worrying, a doctor or nurse can explain without judgement.'},
{t:'My period is making my day hard',a:'That sounds exhausting. Needing to slow down is okay.',i:'Pain, tiredness and heavy flow can all disrupt a day.',s:['Take breaks and keep water nearby','Choose protection that feels secure','Warmth and rest can ease discomfort'],m:'If your period regularly stops you doing normal things, it’s worth speaking to a clinician.'},
{t:'I feel embarrassed asking',a:'Thank you for asking. Periods are a normal part of health, and questions are always welcome.',i:'Almost everyone has wondered about things they felt shy to ask.',s:['Browse the Library privately','Write questions down for a doctor','Ask a trusted person'],m:'Healthcare providers hear period questions every day.'},
{t:'I just need reassurance',a:'You’re doing well by paying attention to your body.',i:'Variation is common, and you don’t have to figure it out alone.',s:['Take a slow breath','Log how today feels','Come back whenever you need'],m:'If worry keeps returning, talking to a clinician can help.'}];
const LIB=[['Period basics','What is a period?','Bleeding from the uterus that usually happens about once a cycle. A period often lasts 3–7 days.'],['Cycle calculations','Counting cycle days','Day 1 is the first day of bleeding. Count start-to-start for cycle length.'],['Understanding symptoms','Common symptoms','Cramps, bloating, tiredness, headaches, acne and mood changes are common around periods.'],['Period pain and self-care','Easing period pain','Warmth, rest and gentle movement can help. Severe or worsening pain deserves medical advice.'],['Irregular periods','What counts as irregular?','Cycles that vary a lot, or are often shorter than 21 or longer than 35 days. Tracking helps a clinician understand.'],['Hormones and cycle phases','Hormones in simple terms','Hormone levels rise and fall across the cycle, shaping the four phases.'],['Fertility and ovulation','Ovulation timing','Ovulation timing varies, and calendar apps only estimate it. Not reliable contraception.'],['Menstrual hygiene','Pads, tampons, cups','Change pads or tampons regularly (about every 4–8 hours), wash hands, and follow product instructions.'],['Myths and misconceptions','Myth: every cycle is 28 days','28 is an average. Many healthy cycles are shorter or longer.'],['When to seek medical care','Warning signs','Very heavy bleeding, severe pain, fainting, missed periods for 3+ months, or periods over 7 days.']];
const GL=[['Cycle length','Days from the first day of one period to the first day of the next.'],['Cycle Day 1','The first day of bleeding.'],['Period duration','Number of bleeding days.'],['Ovulation','Release of an egg from an ovary.'],['Fertile window','Days around ovulation when pregnancy is more likely; only estimated here.'],['Follicular phase','From Day 1 until ovulation.'],['Luteal phase','From ovulation until the next period.'],['Spotting','Very light bleeding.'],['Irregular cycle','A cycle that varies a lot or is often outside 21–35 days.'],['Flow','How heavy bleeding is.']];
/* ---- ui helpers ---- */
const card=(h,c='')=>`<div class="card ${c}">${h}</div>`,go=(v,p)=>{V=v;P=p||{};render();scrollTo(0,0)};
function grid(y,mo,f,click){const first=new Date(Date.UTC(y,mo,1)).getUTCDay(),n=new Date(Date.UTC(y,mo+1,0)).getUTCDate(),T=click?'button':'span';let h='<div class=gr>'+[...'SMTWTFS'].map(x=>`<i>${x}</i>`).join('');for(let k=0;k<first;k++)h+='<i></i>';for(let d=1;d<=n;d++){const ds=fd(Date.UTC(y,mo,d)/D);h+=`<${T} class="c ${f(pd(ds),ds)}" ${click?`onclick="A.sel('${ds}')" aria-label="${nice(pd(ds),1)}"`:''}>${d}</${T}>`}return h+'</div>'}
const chips=(k,o,multi)=>o.map(x=>{const on=multi?(P.f[k]||[]).includes(x):P.f[k]===x;return `<button class="ch ${on?'on':''}" aria-pressed="${on}" onclick="A.tog('${k}','${x}',${!!multi})">${x}</button>`}).join('');
/* ---- views ---- */
function onb(){return `<h1>Getting to know your cycle starts here.</h1><p class=m>Let’s learn about your body, one day at a time. Everything below is optional — skip anything you like.</p>
${card(`<label for=n>What should I call you?</label><input id=n placeholder="Name or nickname (optional)">
<label for=d>First day of your last period</label><input id=d type=date><small>The first day you saw bleeding.</small>
<label for=c style="margin-top:10px">Usual cycle length (days)</label><input id=c type=number min=15 max=60 placeholder="e.g. 28"><small>Count from the first day of one period to the first day of the next.</small><label style="font-weight:400;margin:8px 0"><input type=checkbox id=u> I don’t know yet</label>
<label for=p>Usual period length (days)</label><input id=p type=number min=1 max=14 placeholder="e.g. 5">
<label for=r>Are your periods…</label><select id=r><option value="">Not sure</option><option>Regular</option><option>Irregular</option><option>Unpredictable</option></select>
<label style="font-weight:400"><input type=checkbox id=t checked> Send me educational tips</label>`)}
<button class=b onclick="A.finish()">Start FlowCare</button><button class=g onclick="A.finish(1)">Skip for now</button>
<p class=m><small>Your records stay on this device. FlowCare gives estimates and education, not medical advice.</small></p>`}
function home(){const i=info(),t=TD(),dn=Math.floor(t%TIPS.length);let h=`<h1>${new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening'}${S.name?', '+esc(S.name):''}</h1>`;
if(!S.intro&&S.setup)h+=card('<h3>How FlowCare works</h3><p><b>Log</b> your period start dates, <b>learn</b> how cycles are counted, and watch your own pattern appear. Predictions are estimates that improve as you log.</p><button class=g onclick="S.intro=1;save();render()">Got it</button>','pink');
if(!i||!i.next)h+=card(`<h3>Let’s get your first prediction</h3><p>${i?'Add your usual cycle length in Settings, or log one more period':'Log the first day of your last period'} and I’ll estimate your next one. Don’t know your cycle length? Two logged periods are enough for FlowCare to work it out.</p><button class=b onclick="go('log')">Log a period</button><button class=g onclick="go('learn')">How does this work?</button>`);
else{const day=t-i.last+1,left=i.next-t,pc=Math.min(1,(day-1)/i.len),R=52,Cc=2*Math.PI*R;
h+=card(`<div class=row><svg width=130 height=130 viewBox="0 0 130 130" role=img aria-label="Cycle day ${day} of about ${i.len}"><circle cx=65 cy=65 r=${R} fill=none stroke="var(--bl)" stroke-width=12 /><circle cx=65 cy=65 r=${R} fill=none stroke="var(--p)" stroke-width=12 stroke-linecap=round stroke-dasharray="${Cc*pc} ${Cc}" transform="rotate(-90 65 65)"/><text x=65 y=64 text-anchor=middle font-size=13 fill="var(--m)">Cycle day</text><text x=65 y=88 text-anchor=middle font-size=26 font-weight=700 fill="var(--t)">${day}</text></svg>
<div><h3>${left>0?`Next period in ~${left} day${left>1?'s':''}`:left==0?'Your period is expected today':`${-left} day${-left>1?'s':''} past the estimate`}</h3><p class=m>Estimated ${nice(i.next,1)}.${left<0?' Late periods happen — see A Little Comfort.':''}</p></div></div><small class=m>Estimate based on a ${i.len}-day cycle. Not contraception or medical advice.</small>`)}
h+=`<button class=b onclick="A.start(fd(TD()))">Period started today</button><button class=g onclick="go('log')">Log symptoms &amp; mood</button>`;
if(S.tips)h+=card(`<b>Tip</b><p>${TIPS[dn]}</p>`,'pink');
h+=card(`<p>💗 ${MSG[dn]}</p>`)+`<p><a href="#" onclick="go('learn');return false">Learn something about your cycle →</a></p><p><a href="#" onclick="go('cal');return false">Open the calendar →</a></p>`;return h}
function cal(){const t=TD(),i=info(),n=new Date();let m=P.m??n.getFullYear()*12+n.getMonth();const y=Math.floor(m/12),mo=m%12,rec=new Set(),pr=new Set(),fe=new Set(),ov=new Set();
S.periods.forEach(p=>{for(let d=pd(p.start);d<=pd(p.end||p.start);d++)rec.add(d)});
if(i&&i.next)for(let k=0;k<3;k++){const nx=i.next+k*i.len,o=C.ovul(nx);for(let d=nx;d<nx+i.dur;d++)if(d>=t)pr.add(d);if(o>=t)ov.add(o);for(let d=o-5;d<=o+1;d++)if(d>=t)fe.add(d)}
let h=`<h1>Calendar</h1><div class=row><button class=g onclick="P.m=${m-1};render()" aria-label="Previous month">‹</button><b>${new Date(Date.UTC(y,mo,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})}</b><button class=g onclick="P.m=${m+1};render()" aria-label="Next month">›</button></div>`;
h+=grid(y,mo,(d,ds)=>[rec.has(d)?'rec':pr.has(d)?'pred':'',fe.has(d)&&!rec.has(d)?'fert':'',ov.has(d)?'ov':'',d==t?'tod':'',S.logs[ds]?'sym':'',P.sel==ds?'sel':''].join(' '),1);
h+='<div class=lg><span><b style="color:var(--d)">■</b> Recorded</span><span>⬚ Predicted</span><span><b style="color:var(--bl)">■</b> Est. fertile window</span><span>◆ Est. ovulation</span><span>• Symptoms logged</span></div><small class=m>Recorded days are what you logged. Predicted, fertile and ovulation days are estimates only.</small>';
if(P.sel){const d=pd(P.sel),lg=S.logs[P.sel],st=rec.has(d)?'Recorded period day':pr.has(d)?'Predicted period day (estimate)':fe.has(d)?'Estimated fertile window (estimate)':'No period recorded';
h+=card(`<h3>${nice(d,1)}</h3><p>${st}${ov.has(d)?' · Estimated ovulation':''}</p>${lg?`<p><small>${[lg.flow&&'Flow: '+lg.flow,lg.pain!=null&&'Pain '+lg.pain+'/5',...(lg.symptoms||[]),lg.mood&&lg.mood.join?lg.mood.join(', '):'',lg.notes&&'“'+esc(lg.notes)+'”'].filter(Boolean).join(' · ')}</small></p>`:'<p class=m><small>No symptoms logged.</small></p>'}
<button class=b onclick="A.start('${P.sel}')">Period started</button><button class=g onclick="A.end('${P.sel}')">Period ended</button><button class=g onclick="go('log',{d:'${P.sel}'})">Log symptoms</button>${rec.has(d)?`<button class=g onclick="A.rm('${P.sel}')">Remove period record</button>`:''}`)}
return h}
function log(){const d=P.d||fd(TD());if(!P.f){P.f=JSON.parse(JSON.stringify(S.logs[d]||{symptoms:[],mood:[]}));P.f.symptoms=P.f.symptoms||[];P.f.mood=P.f.mood||[]}
return `<h1>Log</h1><label for=ld>Date</label><input id=ld type=date value="${d}" max="${fd(TD())}" onchange="P.d=this.value;P.f=null;render()">
<div>${card(`<b>Period</b><br><button class=b onclick="A.start('${d}')">Started</button><button class=g onclick="A.end('${d}')">Ended</button>`)}</div>
<b>Flow</b><br>${chips('flow',['Spotting','Light','Medium','Heavy'])}<br><br><b>Cramps &amp; pain (0 none – 5 severe)</b><br>${[0,1,2,3,4,5].map(n=>`<button class="ch ${P.f.pain===n?'on':''}" onclick="P.f.pain=${n};render()">${n}</button>`).join('')}
<br><br><b>Symptoms</b><br>${chips('symptoms',['Cramps','Headache','Bloating','Back pain','Fatigue','Acne','Nausea','Appetite changes','Other'],1)}<br><br><b>Mood</b><br>${chips('mood',['Happy','Calm','Anxious','Irritable','Low','Emotional'],1)}<br><br><b>Energy</b><br>${chips('energy',['Low','Okay','High'])}<br><br><b>Sleep</b><br>${chips('sleep',['Poor','Okay','Good'])}<br><br>
<label for=nt>Notes</label><textarea id=nt rows=3 oninput="P.f.notes=this.value">${esc(P.f.notes||'')}</textarea><button class=b onclick="A.saveLog('${d}')">Save</button>${S.logs[d]?`<button class=g onclick="A.rmLog('${d}')">Delete this day’s log</button>`:''}`}
function learn(){const n=Object.keys(S.done).length;
if(P.l==null)return `<h1>Understand Your Cycle</h1>${card(`<div class=row><b>Progress</b><span>${n}/8 lessons</span></div><div class=bar><div style="width:${n/8*100}%"></div></div>`)}${L.map((l,k)=>`<button class="card" style="width:100%;text-align:left;color:var(--t)" onclick="go('learn',{l:${k}})"><b>${S.done[k]?'✓ ':''}Lesson ${k+1}</b><br>${l.t}</button>`).join('')}
<h2>Tools</h2>${card(`<h3>Cycle length calculator</h3><label for=a1>First day of period A</label><input id=a1 type=date><label for=a2>First day of period B</label><input id=a2 type=date><button class=b onclick="A.len()">Calculate</button><p id=r1></p>`)}
${card(`<h3>Period date estimator</h3><label for=b1>First day of your last period</label><input id=b1 type=date><label for=b2>Usual cycle length</label><input id=b2 type=number min=15 max=60><button class=b onclick="A.est()">Estimate</button><p id=r2></p>`)}<p><a href="#" onclick="go('lib',{g:1});return false">Open the glossary →</a></p>`;
const l=L[P.l];return `<button class=g onclick="go('learn')">← Lessons</button><h1>Lesson ${P.l+1}: ${l.t}</h1>${l.b()}<button class=g onclick="$('#sm').hidden=!$('#sm').hidden">Explain this simply</button><p id=sm hidden class="card pink">${l.s}</p>
${card(`<h3>Quick check</h3><p>${l.q.q}</p>${l.q.o.map((o,j)=>`<button class=ch onclick="A.q(${P.l},${j})">${o}</button>`).join('')}<p id=fb></p>`)}${P.l<7?`<button class=b onclick="go('learn',{l:${P.l+1}})">Next lesson</button>`:''}`}
function comfort(){if(P.c==null)return `<h1>A Little Comfort</h1><p class=m>What’s on your mind?</p>${CM.map((c,k)=>`<button class=card style="width:100%;text-align:left;color:var(--t)" onclick="go('comfort',{c:${k}})">${c.t}</button>`).join('')}`;
const c=CM[P.c],i=info(),t=TD();let late='';if(c.late&&i&&i.next&&i.next<t)late=`<p>Your estimated date was ${nice(i.next,1)}, so you’re ${t-i.next} day${t-i.next>1?'s':''} past it. Your last recorded period started on ${nice(i.last,1)}.</p>`;
return `<button class=g onclick="go('comfort')">← Back</button><h1>${c.t}</h1>${card(`<p>${c.a}</p>${late}`,'pink')}<p>${c.i}</p><h3>What you can do</h3><ul>${c.s.map(x=>`<li>${x}</li>`).join('')}</ul>${card(`<b>When to get medical advice</b><p>${c.m}</p>`)}<p class=m><small>This is general education, not a diagnosis.</small></p>`}
function lib(){const q=(P.q||'').toLowerCase();let h=`<h1>Library</h1><input placeholder="Search articles and glossary" value="${esc(P.q||'')}" oninput="P.q=this.value;P.keep=1;A.lib()" aria-label=Search><div id=lb></div>`;return h}
function libBody(){const q=(P.q||'').toLowerCase(),a=LIB.filter(x=>x.join(' ').toLowerCase().includes(q)),g=GL.filter(x=>x.join(' ').toLowerCase().includes(q));
return (a.length?'<h2>Articles</h2>'+a.map(x=>card(`<small class=m>${x[0]}</small><h3>${x[1]}</h3><p>${x[2]}</p>`)).join(''):'')+(g.length?'<h2>Glossary</h2>'+g.map(x=>`<p><b>${x[0]}</b> — ${x[1]}</p>`).join(''):'')+(!a.length&&!g.length?'<p class=m>Nothing found. Try another word.</p>':'')+'<p class=m><small>Written from general guidance published by bodies such as ACOG, the NHS and Mayo Clinic. This prototype’s wording should be reviewed by a clinician before public release.</small></p>'}
function ins(){const i=info(),L2=i?i.L:[],dr=C.durs(S.periods),lg=Object.values(S.logs),cnt=k=>{const m={};lg.forEach(l=>(l[k]||[]).forEach(x=>m[x]=(m[x]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>`${x[0]} (${x[1]})`).join(', ')||'—'},pains=lg.filter(l=>l.pain!=null).map(l=>l.pain);
let h='<h1>Insights</h1>';if(L2.length<2)h+=card(`<p>Keep tracking to build a useful history. Insights appear after about three logged periods (two completed cycles).</p><p class=m>Logged so far: ${S.periods.length} period${S.periods.length==1?'':'s'}.</p>`,'pink');
else h+=card(`<p>Based on your last ${L2.length} recorded cycles, your cycle lengths have ranged from ${Math.min(...L2)} to ${Math.max(...L2)} days, averaging ${C.avg(L2)} days.</p>${dr.length?`<p>Average period duration: ${C.avg(dr)} days (from ${dr.length} with an end date).</p>`:''}<small class=m>These are patterns in your records, not medical conclusions.</small>`);
return h+card(`<p><b>Most recorded symptoms:</b> ${cnt('symptoms')}</p><p><b>Frequent moods:</b> ${cnt('mood')}</p><p><b>Average pain:</b> ${pains.length?(pains.reduce((a,b)=>a+b,0)/pains.length).toFixed(1)+'/5':'—'}</p>`)}
function more(){return `<h1>More</h1>${[['log','Log symptoms & mood'],['lib','Library & glossary'],['ins','Insights'],['set','Settings & privacy']].map(x=>`<button class=card style="width:100%;text-align:left;color:var(--t)" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}`}
function set(){const r=S.rem,tg=(k,l)=>`<label style="font-weight:400"><input type=checkbox ${r[k]?'checked':''} onchange="S.rem.${k}=this.checked?1:0;save()"> ${l}</label>`;
return `<h1>Settings &amp; privacy</h1>${card(`<label for=sn>Name</label><input id=sn value="${esc(S.name)}" onchange="S.name=this.value.trim();save()"><label for=sc>Usual cycle length (days)</label><input id=sc type=number value="${S.cl||''}" onchange="S.cl=+this.value||null;save()">`)}
${card(`<h3>Reminder preferences</h3>${tg('period','Expected period')}${tg('log','Symptom logging')}${tg('tips','Educational tips')}<label for=rt>Preferred time</label><input id=rt type=time value="${r.time}" onchange="S.rem.time=this.value;save()"><p class=m><small>Heads up: this prototype saves these preferences but cannot send notifications yet. Real reminders need a push or native layer; they should use neutral wording like “Time for your FlowCare check-in”.</small></p>`)}
${card(`<h3>Privacy</h3><p>Your records are stored only in this browser on this device. Nothing is sent anywhere. Clearing browser data erases them. Production use needs an encrypted, access-controlled backend.</p><button class=g onclick="P.x=!P.x;render()">Export my data</button><button class=g onclick="A.del()">${P.del?'Tap again to delete everything':'Delete all my data'}</button>${P.x?`<textarea rows=7 readonly onclick="this.select()">${esc(JSON.stringify(S,null,1))}</textarea><button class=g onclick="navigator.clipboard&amp;&amp;navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Copied'),()=>toast('Select and copy manually'))">Copy</button>`:''}`)}
${card(`<small>FlowCare offers education and estimates. It doesn’t diagnose, replace healthcare professionals, or work as contraception or a pregnancy test.</small>`)}<button class=g onclick="P.t=T();render()">Run date-calculation tests</button>${P.t?`<pre style="white-space:pre-wrap;font-size:13px">${P.t}</pre>`:''}`}
const views={home,cal,learn,comfort,log,lib,ins,more,set};
function T(){const r=[],ok=(n,a,b)=>r.push((a===b?'✓ ':'✗ ')+n+(a===b?'':` (got ${a}, want ${b})`));
ok('cycle length 1→29 Mar',C.diff('2026-03-01','2026-03-29'),28);ok('3 Jun→1 Jul',C.diff('2026-06-03','2026-07-01'),28);ok('add across month',C.add('2026-05-10',30),'2026-06-09');ok('leap year Feb',C.diff('2024-02-28','2024-03-01'),2);ok('year boundary',C.add('2025-12-30',5),'2026-01-04');
ok('lens',C.lens([{start:'2026-01-01'},{start:'2026-01-29'},{start:'2026-02-28'}]).join(),'28,30');ok('avg',C.avg([27,31]),29);ok('duration',C.durs([{start:'2026-03-03',end:'2026-03-07'}])[0],5);ok('ovulation',C.ovul(100),86);return r.join('\n')}
const A={sel(d){P.sel=d;render()},tog(k,v,m){if(m){const a=P.f[k]=P.f[k]||[],x=a.indexOf(v);x<0?a.push(v):a.splice(x,1)}else P.f[k]=P.f[k]===v?null:v;render()},
 finish(s){if(!s){const d=$('#d').value,u=$('#u').checked,c=+$('#c').value,p=+$('#p').value;if(d&&pd(d)>TD())return toast('That date is in the future — please check it.');if(!u&&$('#c').value&&(c<15||c>60))return toast('Cycle length is usually 15–60 days.');if($('#p').value&&(p<1||p>14))return toast('Period length should be 1–14 days.');
 S.name=$('#n').value.trim();S.cl=!u&&c?c:null;S.pl=p||null;S.reg=$('#r').value;S.tips=$('#t').checked?1:0;S.rem.tips=S.tips;if(d)S.periods.push({start:d,end:S.pl?C.add(d,S.pl-1):null})}S.setup=1;save();go('home')},
 start(d){if(pd(d)>TD())return toast('Can’t log a period in the future.');if(!S.periods.some(p=>p.start==d))S.periods.push({start:d,end:null});S.periods.sort((a,b)=>a.start<b.start?-1:1);save();toast('Period start saved');render()},
 end(d){const c=S.periods.filter(p=>p.start<=d).pop();if(!c)return toast('Log a period start first.');if(pd(d)-pd(c.start)>14)return toast('That’s over 14 days after the start — check the dates.');c.end=d;save();toast('Period end saved');render()},
 rm(d){S.periods=S.periods.filter(p=>!(p.start<=d&&d<=(p.end||p.start)));save();render()},
 saveLog(d){const f=P.f;if(!(f.flow||f.pain!=null||f.symptoms.length||f.mood.length||f.energy||f.sleep||f.notes))return toast('Add something to log first.');S.logs[d]=f;save();toast('Saved');P.f=null;go('cal',{sel:d})},
 rmLog(d){delete S.logs[d];save();P.f=null;render()},
 q(l,j){const q=L[l].q;$('#fb').innerHTML=(j==q.a?'<b>Nice work!</b> ':'<b>You’re learning!</b> Let’s go through it together. ')+q.w;S.done[l]=1;save()},
 len(){const a=$('#a1').value,b=$('#a2').value;$('#r1').innerHTML=a&&b&&pd(b)>pd(a)?`Cycle length: <b>${C.diff(a,b)} days</b> (${nice(pd(a))} to ${nice(pd(b))}, counted start to start).`:'Enter two dates, with B after A.'},
 est(){const a=$('#b1').value,c=+$('#b2').value;$('#r2').innerHTML=a&&c>=15&&c<=60?`Estimated next period: <b>${nice(pd(C.next(a,c)),1)}</b>. It’s an estimate; it may come earlier or later.`:'Enter a date and a cycle length of 15–60 days.'},
 lib(){$('#lb').innerHTML=libBody()},del(){if(!P.del){P.del=1;return render()}S=JSON.parse(JSON.stringify(DEF));try{localStorage.removeItem('fc')}catch(e){}P={};V='home';render()}};
function render(){const k=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('aria-label')=='Search';
$('#app').innerHTML=S.setup?views[V]():onb();if(V=='lib'&&S.setup){A.lib();if(P.keep){const i=$('#app input');i.focus();i.setSelectionRange(99,99);P.keep=0}}
const N=[['home','🏠','Home'],['cal','📅','Calendar'],['learn','📖','Learn'],['comfort','💗','Comfort'],['more','☰','More']],g={log:'more',lib:'more',ins:'more',set:'more'};
let n=document.querySelector('nav');if(n)n.remove();if(S.setup)document.body.insertAdjacentHTML('beforeend',`<nav aria-label=Main>${N.map(x=>`<button class="${(g[V]||V)==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`)}
render();
</script></body></html>
